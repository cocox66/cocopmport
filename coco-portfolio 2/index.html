<style>
  :root{
    --paper:#FCF8F9;
    --ink:#221F1D;
    --muted:#8C867F;
    --rose:#C24A6E;
    --rose-bright:#D25579;
    --rose-tint:#F5E8ED;
    --line:#ECE5E1;
    --display:'Cormorant Garamond','Noto Serif SC',Georgia,serif;
    --body:'EB Garamond','Noto Serif SC',Georgia,serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{background:var(--paper);color:var(--ink);font-family:var(--body);
    font-size:19px;line-height:1.66;-webkit-font-smoothing:antialiased}
  .wrap{max-width:720px;margin:0 auto;padding:0 28px}
  a{color:inherit}

  /* hero */
  header{padding:15vh 0 9vh}
  .bird{width:92px;height:auto;display:block;margin-bottom:30px}
  .bird path{fill:none;stroke:var(--rose-bright);stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round;
    stroke-dasharray:600;stroke-dashoffset:600;animation:draw 3.4s .2s ease forwards}
  @keyframes draw{to{stroke-dashoffset:0}}
  h1{font-family:var(--display);font-weight:500;font-size:clamp(3.2rem,10vw,5.8rem);
    line-height:.97;letter-spacing:-.01em}
  .lede{font-family:var(--display);font-size:clamp(1.3rem,3.3vw,1.72rem);font-weight:400;
    line-height:1.42;color:#403b37;max-width:34ch;margin-top:24px}
  .lede b{font-weight:600;color:var(--ink)}
  @keyframes rise{to{opacity:1;transform:none}}
  .strip{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin-top:38px}
  .strip img{height:170px;width:auto;max-width:100%;border-radius:2px;cursor:pointer;transition:transform .4s ease}
  .strip img:hover{transform:translateY(-3px);filter:saturate(1.1)}

  /* identity list */
  section.roles{padding:1vh 0 9vh}
  .roles__intro{font-family:var(--display);font-style:italic;font-size:1.5rem;color:var(--muted);margin-bottom:4px}
  .role{border-top:1px solid var(--line)}
  .role:last-child{border-bottom:1px solid var(--line)}
  .role__head{width:100%;background:none;border:0;cursor:pointer;text-decoration:none;display:flex;align-items:baseline;
    justify-content:space-between;gap:20px;padding:22px 2px;text-align:left;color:var(--ink);
    font-family:var(--display);font-size:clamp(2rem,5.4vw,2.9rem);font-weight:500;line-height:1;
    letter-spacing:-.01em;transition:color .25s ease}
  .role__head:hover,.role__head:focus-visible{color:var(--rose);outline:none}
  .role__head .plus{font-family:var(--body);font-size:1.05rem;color:var(--muted);flex:0 0 auto;
    transform:translateY(-.35em);transition:transform .3s ease,color .25s ease}
  .role.open .plus.p{transform:translateY(-.35em) rotate(45deg);color:var(--rose)}
  .role__body{overflow:hidden;max-height:0;transition:max-height .45s cubic-bezier(.2,.7,.2,1)}
  .role__inner{padding:2px 2px 32px;max-width:60ch}
  .role__inner>p{color:#403b37}
  .role__inner>p+p{margin-top:12px}

  .work{margin-top:24px;padding-top:24px;border-top:1px dotted var(--line)}
  .work:first-child{border-top:0;margin-top:14px;padding-top:0}
  .work h4{font-family:var(--display);font-size:1.55rem;font-weight:600;line-height:1.12}
  .work .meta{font-size:.9rem;color:var(--muted);margin:2px 0 9px;font-style:italic}
  .work p{font-size:1rem;line-height:1.6;color:#403b37}
  .work p.excerpt{font-style:italic;color:#4a443f}
  .work .more{margin-top:10px}
  .links{margin-top:11px;display:flex;gap:20px;flex-wrap:wrap;align-items:center}
  a.pink,.linkbtn{color:var(--rose);text-decoration:none;font-family:var(--body);font-size:.95rem;
    background:none;border:0;border-bottom:1px solid var(--rose);padding:0 0 1px;cursor:pointer;transition:opacity .2s}
  a.pink:hover,.linkbtn:hover{opacity:.6}
  .chip{font-family:var(--body);font-size:.62em;font-style:normal;color:var(--rose);
    border:1px solid var(--rose);border-radius:999px;padding:2px 9px;vertical-align:middle;margin-left:8px}
  .stat-line{margin-top:14px!important;font-size:1.05rem}
  .stat-line b{font-weight:600}
  .handle{margin-top:6px!important;font-style:italic;color:var(--muted)}

  /* footer */
  footer{padding:7vh 0 13vh;border-top:1px solid var(--line)}
  .say{font-family:var(--display);font-style:italic;font-size:1.5rem;color:var(--muted);margin-bottom:14px}
  .contacts{display:flex;gap:26px;flex-wrap:wrap}
  .contacts a{text-decoration:none;border-bottom:1px solid transparent;padding-bottom:2px;transition:border-color .2s,color .2s}
  .contacts a:hover{color:var(--rose);border-color:var(--rose)}
  .fine{margin-top:36px;font-size:.85rem;color:var(--muted);max-width:52ch}

  /* gallery view */
  #gallery{display:none;padding:8vh 0 12vh}
  body.gallery-open #home{display:none}
  body.gallery-open #gallery{display:block}
  .back{background:none;border:0;cursor:pointer;font-family:var(--display);font-style:italic;
    font-size:1.1rem;color:var(--muted);margin-bottom:3vh;transition:color .2s}
  .back:hover{color:var(--rose)}
  #gallery h2{font-family:var(--display);font-weight:500;font-size:clamp(2.4rem,7vw,3.6rem);line-height:1;margin-bottom:18px}
  #gintro{max-width:60ch;color:#403b37;margin-bottom:22px}
  .gstats{display:flex;gap:34px;flex-wrap:wrap;margin-bottom:6px;align-items:baseline}
  .gstats .n{font-family:var(--display);font-size:2.6rem;font-weight:500;line-height:1;color:var(--rose)}
  .gstats .l{font-size:.9rem;color:var(--muted);margin-top:2px}
  #glatest{font-size:.98rem;color:var(--muted);margin:14px 0 34px}
  .grid{column-count:3;column-gap:12px}
  .tile{position:relative;overflow:hidden;border-radius:2px;cursor:pointer;background:var(--rose-tint);break-inside:avoid;margin:0 0 12px}
  .tile img{width:100%;height:auto;display:block;transition:transform .5s ease,filter .3s ease}
  .tile:hover img{transform:scale(1.04);filter:brightness(.6)}
  .tile figcaption{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;
    align-items:center;text-align:center;gap:2px;padding:12px;opacity:0;color:#fff;transition:opacity .3s ease}
  .tile:hover figcaption{opacity:1}
  .tile figcaption span{font-family:var(--display);font-size:1.25rem;font-weight:600;line-height:1.15}
  .tile figcaption em{font-size:.85rem;opacity:.9}
  .gfine{margin-top:30px;font-size:.85rem;color:var(--muted)}

  /* lightbox */
  #lightbox{position:fixed;inset:0;background:rgba(30,22,26,.92);display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:16px;padding:30px;opacity:0;pointer-events:none;
    transition:opacity .3s ease;z-index:100}
  #lightbox.on{opacity:1;pointer-events:auto}
  #lightbox img{max-width:92vw;max-height:80vh;object-fit:contain;border-radius:2px}
  .lb-cap{color:#f4eef0;font-family:var(--display);font-size:1.3rem}

  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important}
    .bird path{stroke-dashoffset:0}
  }
  @media(max-width:560px){.strip img{height:110px}.grid{column-count:2}}
</style>

      { name: "Boston",     lat: 42.36, lon: -71.06, note: "I spent high school on the east coast and loved Boston." },
      { name: "Stanford",   lat: 37.43, lon: -122.17, note: "Where I study now: Stanford University." },
      { name: "San Carlos", lat: 37.51, lon: -122.26, dx: 0, dy: -6, note: "This past summer I had my first-ever biopharma role at BeOne Medicines, where I worked on the patient side doing patient engagement and product management for a patient-navigator platform, focusing on new content creation, streamlining internal workflows, and building external outreach and partnerships." },
      { name: "Oxford",     lat: 51.75, lon: -1.26, note: "Next winter (2026-2027) I'm heading to Oxford to study birds, can't wait!" },
    ],
    contacts: [
      { icon: "github",   label: "GitHub",   href: "https://github.com/cocox66" },
      { icon: "mail",     label: "Email",    href: "mailto:cocoxia@stanford.edu" },
      { icon: "linkedin", label: "LinkedIn", href: "https://www.linkedin.com/in/coco-xia-stanford" },
    ],
  },
};

const C=CONFIG,$=s=>document.querySelector(s);
const nCountries=(C.fieldNotes.countries||[]).length;
const alink=(h,l)=>h?`<a class="pink" href="${h}" target="_blank" rel="noopener">${l}</a>`:'';

$('#lede').innerHTML=`I build and ship <b>AI products</b>, and I&rsquo;ve counted <b>${C.fieldNotes.lifeList} bird species</b> across ${nCountries} countries.`;
$('#contacts').innerHTML=C.student.contacts.map(c=>`<a href="${c.href}"${c.href.startsWith('mailto')?'':' target="_blank" rel="noopener"'}>${c.label}</a>`).join('');

// hero photo strip (first 3)
$('#strip').innerHTML=C.fieldNotes.photos.slice(0,3).map(p=>`<img loading="lazy" src="${p.src}" alt="${p.caption}">`).join('');
$('#strip').addEventListener('click',openGallery);

// ---- role inner builders ----
const appsHTML=()=>C.apps.items.map(a=>`<div class="work"><h4>${a.name}${a.inProgress?'<span class="chip">in progress</span>':''}</h4><div class="meta">${a.tech}</div><p>${a.desc}</p><div class="links">${alink(a.code,'Code')}${alink(a.live,a.liveLabel||'Live')}${alink(a.demo,'Demo')}</div></div>`).join('');
const researchHTML=()=>{const r=C.research;return `<div class="work"><h4>${r.inPress.label}</h4><p>${r.inPress.note}</p></div><div class="work"><h4>${r.heading}</h4><p>${r.summary}</p><p style="margin-top:10px">${r.abstract}</p><div class="links">${alink(r.posterPdf,'View the poster')}</div></div>`;};
const strategyHTML=()=>C.strategy.items.map(a=>`<div class="work"><h4>${a.name}</h4><div class="meta">${a.meta}</div><p>${a.desc}</p><div class="links">${a.links.map(l=>alink(l.href,l.label)).join('')}</div></div>`).join('');
const creatorHTML=()=>{const c=C.creator,e=(c.engagements/1000).toFixed(1).replace(/\.0$/,'')+'k';return `<p>${c.blurb}</p><p class="stat-line"><b>${c.followers.toLocaleString()}</b> followers &nbsp;&middot;&nbsp; <b>${e}</b> likes &amp; saves</p><p class="handle">${c.handle}</p>`;};
const writingHTML=()=>C.writing.pieces.map((p,i)=>`<div class="work"><h4>${p.title}</h4><div class="meta">${p.subtitle}</div><p class="excerpt">${p.excerpt}</p>${p.page?`<div class="links">${alink(p.page,'Read the full story')}</div>`:`<p class="more" id="m${i}" hidden>${p.more||''}</p><div class="links"><button class="linkbtn" data-more="m${i}">Read more</button></div>`}</div>`).join('');

const ROLES=[
  {k:'Builder',b:appsHTML},{k:'Researcher',b:researchHTML},{k:'Strategist',b:strategyHTML},
  {k:'Content creator',b:creatorHTML},{k:'Writer',href:'writing.html'},{k:'Birdwatcher',gallery:true},
];
const list=$('#roles');
ROLES.forEach((r,idx)=>{
  const last=idx===ROLES.length-1, label=last?('and '+r.k):r.k;
  const div=document.createElement('div');div.className='role';
  if(r.gallery){
    div.innerHTML=`<button class="role__head" aria-expanded="false">${label} <span class="plus">&rarr;</span></button>`;
    div.querySelector('button').addEventListener('click',openGallery);
  }else if(r.href){
    div.innerHTML=`<a class="role__head" href="${r.href}">${label} <span class="plus">&rarr;</span></a>`;
  }else{
    div.innerHTML=`<button class="role__head" aria-expanded="false">${label} <span class="plus p">+</span></button><div class="role__body"><div class="role__inner">${r.b()}</div></div>`;
    const btn=div.querySelector('.role__head'),body=div.querySelector('.role__body');
    btn.addEventListener('click',()=>{
      if(div.classList.contains('open')){body.style.maxHeight=null;div.classList.remove('open');btn.setAttribute('aria-expanded','false');}
      else{div.classList.add('open');btn.setAttribute('aria-expanded','true');body.style.maxHeight=body.scrollHeight+'px';}
    });
  }
  list.appendChild(div);
});

// read-more toggles (writer)
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-more]');if(!b)return;
  const m=document.getElementById(b.dataset.more),show=m.hasAttribute('hidden');
  if(show){m.removeAttribute('hidden');b.textContent='Show less';}else{m.setAttribute('hidden','');b.textContent='Read more';}
  const body=b.closest('.role__body');if(body)body.style.maxHeight=body.scrollHeight+'px';
});

// ---- gallery ----
const fn=C.fieldNotes;
$('#gintro').textContent=fn.intro;
$('#glife').textContent=fn.lifeList;
$('#gcount').textContent=nCountries;
$('#glatest').innerHTML=`Latest lifer: ${alink(fn.latest.url,fn.latest.name)}${fn.latest.place?' in '+fn.latest.place:''}`;
$('#ggrid').innerHTML=fn.photos.map((p,i)=>`<figure class="tile" data-i="${i}"><img loading="lazy" src="${p.src}" alt="${p.caption}"><figcaption><span>${p.caption}</span><em>${p.place}</em></figcaption></figure>`).join('');
function openGallery(){document.body.classList.add('gallery-open');window.scrollTo(0,0);}
$('#gback').addEventListener('click',()=>{document.body.classList.remove('gallery-open');window.scrollTo(0,0);});

// lightbox
const lb=$('#lightbox');
$('#ggrid').addEventListener('click',e=>{const t=e.target.closest('.tile');if(!t)return;const p=fn.photos[+t.dataset.i];lb.querySelector('img').src=p.src;lb.querySelector('.lb-cap').innerHTML=`${p.caption} &middot; ${p.place}`;lb.classList.add('on');});
lb.addEventListener('click',()=>lb.classList.remove('on'));
document.addEventListener('keydown',e=>{if(e.key==='Escape')lb.classList.remove('on');});
</script>
</body>
</html>
